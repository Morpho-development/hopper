services:
  backend:
    build:
      context: ./backend
    image: hopper-backend:local
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_PATH: ${DATABASE_PATH:-/data/hopper.db}
      STORAGE_PATH: ${STORAGE_PATH:-/storage}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      FIRST_RUN_ADMIN_LOGIN: ${FIRST_RUN_ADMIN_LOGIN:-admin}
      FIRST_RUN_ADMIN_PASSWORD: ${FIRST_RUN_ADMIN_PASSWORD:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      INSTANCE_QUOTA_BYTES: ${INSTANCE_QUOTA_BYTES:-10737418240}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    expose:
      - "8080"
    volumes:
      - hopper-db:/data
      - hopper-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    image: hopper-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"

volumes:
  hopper-db:
  hopper-data:
